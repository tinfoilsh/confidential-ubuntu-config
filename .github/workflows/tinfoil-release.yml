name: Measure and publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: tinfoil-config-release-${{ github.ref_name }}

jobs:
  measure-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Measure and publish the deployment
        uses: tinfoilsh/measure-image-action@768ada355b32b301839c983409304dc53bcc03ff # v0.13.1
        with:
          config-file: ${{ github.workspace }}/tinfoil-config.yml
          github-token: ${{ secrets.GITHUB_TOKEN }}
          mark-as-latest: "true"
